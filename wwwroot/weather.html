
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        h2 {
            margin-bottom: 5px;
        }

        .location {
            text-align: center;
            margin-bottom: 20px;
        }

        .coordinates {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .temperature {
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0 5px;
        }

        .description {
            text-align: center;
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail {
            background: #f5f7f9;
            padding: 15px;
            border-radius: 8px;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
        }

        .search {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .search button {
            padding: 12px 18px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .search button:hover {
            background: #125ca1;
        }

        .status {
            text-align: center;
            color: #666;
            margin: 15px 0;
        }

        .error {
            color: #c62828;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
            }

            .card {
                padding: 18px;
            }

            .temperature {
                font-size: 54px;
            }

            .details {
                gap: 8px;
            }

            .detail {
                padding: 12px;
            }

            .detail-value {
                font-size: 16px;
            }

            .search button {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Weather</h1>

        <form class="search" id="searchForm">
            <input
                type="text"
                id="zipCodeInput"
                placeholder="Enter ZIP code"
                maxlength="5"
                inputmode="numeric"
            >
            <button type="submit">Search</button>
        </form>

        <div id="status" class="status">
            Getting weather...
        </div>

        <div id="weather" class="hidden">

            <div class="location">
                <h2 id="location"></h2>
                <div id="coordinates" class="coordinates"></div>
            </div>

            <div id="temperature" class="temperature"></div>
            <div id="description" class="description"></div>

            <div class="details">

                <div class="detail">
                    <div class="detail-label">Feels Like</div>
                    <div id="feelsLike" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Humidity</div>
                    <div id="humidity" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Cloud Cover</div>
                    <div id="cloudCover" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Wind Speed</div>
                    <div id="windSpeed" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Wind Direction</div>
                    <div id="windDirection" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Wind Gusts</div>
                    <div id="windGusts" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Today's High</div>
                    <div id="highTemperature" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Today's Low</div>
                    <div id="lowTemperature" class="detail-value"></div>
                </div>

                <div class="detail">
                    <div class="detail-label">Precipitation Chance</div>
                    <div id="precipitation" class="detail-value"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    // Determine the application base path.
    // Works locally at /weather/ and in production at /weather/.
   const pathParts = window.location.pathname
    .split("/")
    .filter(part => part.length > 0);

    // Dedicated domain uses the root path.
    // Local development and FollowMeGPS domain use /weather.
    const appBase = pathParts.length === 0
        ? ""
        : "/" + pathParts[0];

    const apiBase = `${appBase}/api/weather`;

    const statusElement = document.getElementById("status");
    const weatherElement = document.getElementById("weather");

    function showStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.className = isError
            ? "status error"
            : "status";

        statusElement.classList.remove("hidden");
    }

    function displayWeather(data) {
        document.getElementById("location").textContent =
            data.location;

        document.getElementById("temperature").textContent =
            `${Math.round(data.temperature)}°F`;

        document.getElementById("description").textContent =
            data.description;

        document.getElementById("feelsLike").textContent =
            `${Math.round(data.feels_like)}°F`;

        document.getElementById("humidity").textContent =
            `${data.humidity}%`;

        document.getElementById("cloudCover").textContent =
            `${data.cloud_cover}%`;

        document.getElementById("windSpeed").textContent =
            `${data.wind_speed} mph`;

        document.getElementById("windDirection").textContent =
            `${data.wind_direction}°`;

        document.getElementById("windGusts").textContent =
            `${data.wind_gusts} mph`;

        document.getElementById("highTemperature").textContent =
            `${Math.round(data.high_temperature)}°F`;

        document.getElementById("lowTemperature").textContent =
            `${Math.round(data.low_temperature)}°F`;

        document.getElementById("precipitation").textContent =
            `${data.precipitation_probability}%`;

        const coordinatesElement =
            document.getElementById("coordinates");

        if (
            data.latitude !== undefined &&
            data.longitude !== undefined
        ) {
            coordinatesElement.textContent =
                `GPS: ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)}`;
        } else {
            coordinatesElement.textContent = "";
        }

        weatherElement.classList.remove("hidden");
        statusElement.classList.add("hidden");
    }

    async function getWeatherByZip(zipCode) {
        showStatus("Getting weather...");

        try {
            const response = await fetch(
                `${apiBase}/${encodeURIComponent(zipCode)}`
            );

            if (!response.ok) {
                const error = await response.json();
                throw new Error(
                    error.detail || "Unable to retrieve weather."
                );
            }

            const data = await response.json();

            displayWeather(data);

        } catch (error) {
            showStatus(error.message, true);
            weatherElement.classList.add("hidden");
        }
    }

    async function getWeather(latitude, longitude) {
        showStatus("Getting weather for your location...");

        try {
            const response = await fetch(
                `${apiBase}/location?latitude=${latitude}&longitude=${longitude}`
            );

            if (!response.ok) {
                const error = await response.json();
                throw new Error(
                    error.detail || "Unable to retrieve weather."
                );
            }

            const data = await response.json();

            // Include the coordinates supplied by the browser.
            data.latitude = latitude;
            data.longitude = longitude;

            displayWeather(data);

        } catch (error) {
            showStatus(error.message, true);
            weatherElement.classList.add("hidden");
        }
    }

    function searchByZip(zipCode) {
        if (!/^\d{5}$/.test(zipCode)) {
            showStatus("Please enter a valid five-digit ZIP code.", true);
            return;
        }

        // Navigate to the ZIP-specific page.
        window.location.href = `${appBase}/${zipCode}`;
    }

    function requestGpsLocation() {
        if (!navigator.geolocation) {
            showStatus(
                "Your browser does not support GPS location.",
                true
            );
            return;
        }

        showStatus("Getting your GPS location...");

        navigator.geolocation.getCurrentPosition(
            position => {
                getWeather(
                    position.coords.latitude,
                    position.coords.longitude
                );
            },
            handleLocationError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 300000
            }
        );
    }

    function handleLocationError(error) {
        let message;

        switch (error.code) {
            case error.PERMISSION_DENIED:
                message = "Location permission was denied.";
                break;

            case error.POSITION_UNAVAILABLE:
                message = "Your location is unavailable.";
                break;

            case error.TIMEOUT:
                message = "GPS location request timed out.";
                break;

            default:
                message = "Unable to determine your location.";
        }

        showStatus(message, true);
    }

    document.getElementById("searchForm")
        .addEventListener("submit", event => {
            event.preventDefault();

            const zipCode = document
                .getElementById("zipCodeInput")
                .value
                .trim();

            searchByZip(zipCode);
        });

    // Determine whether a ZIP code was included in the URL.
    const zipCode = pathParts.length > 1
        ? pathParts[1]
        : null;

    if (zipCode) {
        getWeatherByZip(zipCode);
    } else {
        requestGpsLocation();
    }
</script>

</body>
</html>
